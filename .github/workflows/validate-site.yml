name: Validate site

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUGO_VERSION: "0.168.0"
      HUGO_SHA256: "787f100057328824f38c6ad7c87ff10d6451ae0a7bc39cedaad0dd2bcde17e53"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Hugo
        shell: bash
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          curl --fail --location --silent --show-error --output "$archive" "$url"
          echo "${HUGO_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar --extract --gzip --file "$archive" --directory /usr/local/bin hugo
          hugo version

      - name: Build and validate
        run: scripts/validate_site.sh
