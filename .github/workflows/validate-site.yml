name: Validate site

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUGO_VERSION: "0.154.5"
      HUGO_SHA256: "372d2f0538b24d2bb9285f0583c1e3b02d023ec2c2b8eb90e5c3bbfb3139fb13"

    steps:
      - name: Check out full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Hugo
        shell: bash
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          curl --fail --location --silent --show-error --output "$archive" "$url"
          echo "${HUGO_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar --extract --gzip --file "$archive" --directory /usr/local/bin hugo
          hugo version

      - name: Build and validate
        run: scripts/validate_site.sh
