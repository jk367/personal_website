
baseURL = "https://jmkettle.com/"
title = "j.m. kettle"
languageCode = "en-us"
[frontmatter]
lastmod = ["lastmod", "date", "publishDate"]

[outputFormats]
[outputFormats.AIIndex]
mediaType = "application/json"
baseName = "ai-index"
isPlainText = true

[outputFormats.AIContent]
mediaType = "application/json"
baseName = "ai-content"
isPlainText = true

[outputFormats.AINav]
mediaType = "application/json"
baseName = "ai-nav"
isPlainText = true

[outputFormats.AIReadme]
mediaType = "application/json"
baseName = "ai-readme"
isPlainText = true

[outputFormats.AISitemap]
mediaType = "text/plain"
baseName = "ai-sitemap"
isPlainText = true

[outputFormats.LLMS]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true

[outputFormats.Updates]
mediaType = "application/json"
baseName = "updates"
isPlainText = true

[outputs]
home = ["HTML", "RSS", "JSON", "AIIndex", "AIContent", "AINav", "AIReadme", "AISitemap", "LLMS", "Updates"]

[markup.goldmark.renderer]
  unsafe = true

[taxonomies]
  category = "categories"
  writing_category = "writing_categories"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Writing"
    url = "/writing/"
    weight = 2
  [[menu.main]]
    name = "Photos"
    url = "/photos/"
    weight = 3
  [[menu.main]]
    name = "Music"
    url = "/music/"
    weight = 4
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 5

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[minify]
  disableHTML = false
  disableCSS = true
  disableJS = true
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false
      keepSpecialComments = false
      keepDefaultAttrVals = false
      keepDocumentTags = false
      keepEndTags = false
      keepQuotes = false
