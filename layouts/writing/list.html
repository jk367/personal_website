{{ define "main" }}
<h1>Writing</h1>

<div class="back-navigation">
    <a href="/" class="back-button">← Back to Home</a>
</div>

<div class="category-buttons">
    <button class="category-button active" data-category="all" aria-pressed="true">All</button>
    {{ range $name, $taxonomy := .Site.Taxonomies.writing_categories }}
    <button class="category-button" data-category="{{ $name }}" aria-pressed="false">{{ $name }}</button>
    {{ end }}
</div>

<div class="writing-list">
    {{ range .Pages }}
    <div class="writing-item" data-categories="{{ with .Params.writing_categories }}{{ delimit . " " }}{{ end }}">
        <h2 class="writing-title"><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        <span class="writing-date">{{ .Date.Format "January 2, 2006" }}</span>
    </div>
    {{ end }}
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const categoryButtons = document.querySelectorAll('.category-button');
    const writingItems = document.querySelectorAll('.writing-item');

    categoryButtons.forEach(button => {
        button.addEventListener('click', function() {
            const category = this.getAttribute('data-category');
            
            categoryButtons.forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-pressed', 'false');
            });
            this.classList.add('active');
            this.setAttribute('aria-pressed', 'true');

            writingItems.forEach(item => {
                const categories = item.getAttribute('data-categories').split(/\s+/).filter(Boolean);
                if (category === 'all' || categories.includes(category)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    });
});
</script>
{{ end }}
