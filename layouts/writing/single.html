{{ define "main" }}
<article class="content-single">
    <h1>{{ .Title }}</h1>
    <div class="back-navigation">
        <a href="/writing/" class="back-button">← Back to Writing</a>
    </div>
    
    <div class="content">
        {{ .Content }}
    </div>
    {{ if not .Date.IsZero }}
    <time>{{ .Date.Format "January 2, 2006" }}</time>
    {{ end }}
</article>

{{ end }}
