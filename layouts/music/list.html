{{ define "main" }}
<div class="music-content">
    <h1>{{ .Title }}</h1>

    <div class="back-navigation">
        <a href="/" class="back-button">← Back to Home</a>
    </div>

    {{ .Content }}
</div>
<style>
.soundcloud-lazy { position: relative; }
.soundcloud-placeholder {
    width: 100%;
    height: 450px;
    background-color: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #ddd;
}
.soundcloud-placeholder p { color: #666; font-style: italic; }
.soundcloud-lazy iframe { width: 100%; height: 450px; border: 0; display: block; }
.soundcloud-direct { margin-top: 0.25rem; }
</style>
<noscript><style>.soundcloud-placeholder { display: none; }</style></noscript>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const embeds = document.querySelectorAll('.soundcloud-lazy');
    const load = (embed) => {
        if (embed.querySelector('iframe')) return;
        const iframe = document.createElement('iframe');
        iframe.title = embed.dataset.title;
        iframe.src = embed.dataset.src;
        iframe.width = '100%';
        iframe.height = '450';
        iframe.allow = 'autoplay';
        iframe.addEventListener('load', () => {
            const placeholder = embed.querySelector('.soundcloud-placeholder');
            if (placeholder) placeholder.remove();
            iframe.style.position = '';
        }, {once: true});
        // Keep the placeholder and independent listening link while loading.
        iframe.style.position = 'absolute';
        iframe.style.top = '0';
        embed.insertBefore(iframe, embed.firstChild);
    };
    if (!('IntersectionObserver' in window)) {
        embeds.forEach(load);
        return;
    }
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                load(entry.target);
                observer.unobserve(entry.target);
            }
        });
    }, {rootMargin: '100px'});
    embeds.forEach(embed => observer.observe(embed));
});
</script>
{{ end }}
